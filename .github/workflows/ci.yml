name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic jira python-dotenv requests httpx pillow pytest ruff
      - name: Lint with Ruff
        run: |
          ruff check main.py --select E9,F63,F7,F82
          ruff check tests/
      - name: Run unit tests
        run: python -m pytest -v
